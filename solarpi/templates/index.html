{% extends "base.html" %}
{% block title %}SolarPI Dashboard{% endblock %}
{% block stylesheets %}
    {{ super() }}
    <style>
        .chart-tab {
            min-height: 80vh;
        }
    </style>
{% endblock %}
{% block navbar %}
    <div class="d-flex">
        <a class="btn btn-link text-decoration-none me-2" href="/settings/">Settings</a>
        <form method="GET" accept-charset="utf-8" class="d-flex">
            <select name="p" class="form-select me-2"  onchange="this.form.submit()"/>
                {% for v, t in peroid_options %}
                    <option value="{{v}}" {% if selected_peroid == v %}selected{% endif %}>{{t}}</option>
                {% endfor %}
            </select>
            <select name="s" class="form-select me-2"  onchange="this.form.submit()"/>
                {% for v, t in start_options %}
                    <option value="{{v}}" {% if selected_start == v %}selected{% endif %}>{{t}}</option>
                {% endfor %}
            </select>
            <input name="d" class="form-control" type="date" value="{{selected_date}}" onchange="this.form.submit()"/>
        </form>
    </div>
{% endblock %}
{% block content %}
    <div class="main-content container-fluid">
        <div class="row mt-2 g-2">
            <div class="col-lg-2" id="sidebar">{% include "sidebar.html" %}</div>
            <div class="col-lg-10">
                <div class="bg-white shadow-sm border rounded p-3">
                    <ul class="nav nav-underline mb-3" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="power-tab" data-bs-toggle="pill" data-bs-target="#power-tab-content" type="button" role="tab" aria-controls="power-tab-content" aria-selected="true">
                                Power
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="voltages-tab" data-bs-toggle="pill" data-bs-target="#voltages-tab-content" type="button" role="tab" aria-controls="voltages-tab-content" aria-selected="false">
                                Voltage & Current
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="soc-tab" data-bs-toggle="pill" data-bs-target="#soc-tab-content" type="button" role="tab" aria-controls="soc-tab-content" aria-selected="false">
                                Battery SOC
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="temp-tab" data-bs-toggle="pill" data-bs-target="#temp-tab-content" type="button" role="tab" aria-controls="temp-tab-content" aria-selected="false">
                                Temperature
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="energydaily-tab" data-bs-toggle="pill" data-bs-target="#energydaily-tab-content" type="button" role="tab" aria-controls="energydaily-tab-content" aria-selected="false">
                                Daily Energy Production
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="energyweekly-tab" data-bs-toggle="pill" data-bs-target="#energyweekly-tab-content" type="button" role="tab" aria-controls="energyweekly-tab-content" aria-selected="false">
                                Weekly Energy Production
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="peakpower-tab" data-bs-toggle="pill" data-bs-target="#peakpower-tab-content" type="button" role="tab" aria-controls="peakpower-tab-content" aria-selected="false">
                                Daily Peak Power
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="peakcurrent-tab" data-bs-toggle="pill" data-bs-target="#peakcurrent-tab-content" type="button" role="tab" aria-controls="peakcurrent-tab-content" aria-selected="false">
                                Daily Peak Current
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="battery-tab" data-bs-toggle="pill" data-bs-target="#battery-tab-content" type="button" role="tab" aria-controls="battery-tab-content" aria-selected="false">
                                Hourly Battery SOC
                            </button>
                        </li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane chart-tab fade show active" id="power-tab-content" role="tabpanel" aria-labelledby="power-tab" tabindex="0">
                            <canvas id="power-chart"></canvas>
                        </div>
                        <div class="tab-pane chart-tab fade" id="voltages-tab-content" role="tabpanel" aria-labelledby="voltages-tab" tabindex="0">
                            <canvas id="voltages-chart"></canvas>
                        </div>
                        <div class="tab-pane chart-tab fade" id="temp-tab-content" role="tabpanel" aria-labelledby="temp-tab" tabindex="0">
                            <canvas id="temp-chart"></canvas>
                        </div>
                        <div class="tab-pane chart-tab fade" id="soc-tab-content" role="tabpanel" aria-labelledby="soc-tab" tabindex="0">
                            <canvas id="soc-chart"></canvas>
                        </div>
                        <div class="tab-pane chart-tab fade" id="energydaily-tab-content" role="tabpanel" aria-labelledby="energydaily-tab" tabindex="0">
                            <canvas id="energydaily-chart"></canvas>
                        </div>
                        <div class="tab-pane chart-tab fade" id="energyweekly-tab-content" role="tabpanel" aria-labelledby="energyweekly-tab" tabindex="0">
                            <canvas id="energyweekly-chart"></canvas>
                        </div>
                        <div class="tab-pane chart-tab fade" id="peakpower-tab-content" role="tabpanel" aria-labelledby="peakpower-tab" tabindex="0">
                            <canvas id="peakpower-chart"></canvas>
                        </div>
                        <div class="tab-pane chart-tab fade" id="peakcurrent-tab-content" role="tabpanel" aria-labelledby="peakcurrent-tab" tabindex="0">
                            <canvas id="peakcurrent-chart"></canvas>
                        </div>
                        <div class="tab-pane chart-tab fade" id="battery-tab-content" role="tabpanel" aria-labelledby="battery-tab" tabindex="0">
                            <canvas id="battery-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
{% block scripts %}
     {{ super() }}
    <script src="/static/chart.js"></script>
    <script src="/static/moment.min.js"></script>
    <script src="/static/chartjs-adapter-moment.js"></script>
    <script>
        const charts = {
            power: {
                chart: null,
                data: {{power_chart|safe}},
            },
            voltages: {
                chart: null,
                data: {{voltages_chart|safe}},
            },
            soc: {
                chart: null,
                data: {{soc_chart|safe}},
            },
            temp: {
                chart: null,
                data: {{temp_chart|safe}},
            },
            energydaily: {
                chart: null,
                url: '/api/chart/energy-daily/',
            },
            energyweekly: {
                chart: null,
                url: '/api/chart/energy-weekly/',
            },
            peakpower: {
                chart: null,
                url: '/api/chart/peak-power/',
            },
            peakcurrent: {
                chart: null,
                url: '/api/chart/peak-current/',
            },
            battery: {
                chart: null,
                url: '/api/chart/battery-hourly/',
            },
        };
        for (let key in charts) {
            document.getElementById(`${key}-tab`).addEventListener('shown.bs.tab', event => {
                const entry = charts[key];
                if (!entry.chart) {
                    loadChart(key);
                } else {
                    entry.chart.resize();
                }
            });
        }
        // Load first chart
        charts.power.chart = new Chart(document.getElementById(`power-chart`),  charts.power.data);

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function loadChart(key) {
            const entry = charts[key];
            const t = {{state.timestamp}};
            const ctx = document.getElementById(`${key}-chart`);
            if (!entry.data) {
                const r = await fetch(`${entry.url}${t}/`);
                entry.data = await r.json();
            }
            entry.chart = new Chart(ctx, entry.data);
        }

        async function updateSidebar() {
            const sidebar = document.getElementById('sidebar');
            while (true) {
                try {
                    const response = await fetch("/api/sidebar/", {method: "get"});
                    if (!response.ok) {
                        throw new Error(`Response status: ${response.status}`);
                    }
                    sidebar.innerHTML = await response.text();
                } catch (error) {
                    console.log(error);
                }
                await sleep(1000);
            }
        }
        setTimeout(updateSidebar, 1000);

        async function updateCharts() {
            let t = {{state.timestamp}} + 1;
            while (true) {
                try {
                    const response = await fetch(`/api/charts/${t}/`, {method: "get"});
                    if (!response.ok) {
                        throw new Error(`Response status: ${response.status}`);
                    }
                    const updates = await response.json();

                    for (let key in charts) {
                        if (key in updates) {
                            const data = updates[key];
                            if (!charts[key].chart) {
                                // Chart was not yet shown update the data
                                const chart = charts[key].data;
                                chart.data.labels.push(...data.labels);
                                chart.data.datasets.forEach((dataset, i) => {
                                    const ds = data.datasets[i];
                                    dataset.data.push(...ds.data);
                                });
                            } else {
                                const chart = charts[key].chart;
                                // Convert back to integer
                                t = Math.round(data.labels[data.labels.length - 1]/1000)+1;
                                chart.data.labels.push(...data.labels);
                                chart.data.datasets.forEach((dataset, i) => {
                                    const ds = data.datasets[i];
                                    dataset.data.push(...ds.data);
                                });
                                chart.update();
                            }
                        }
                    }

                } catch (error) {
                    console.log(error);
                }
                await sleep(5000);
            }
        }
        {% if is_today and not selected_start %}
            setTimeout(updateCharts, 5000);
        {% endif %}
    </script>
{% endblock %}
